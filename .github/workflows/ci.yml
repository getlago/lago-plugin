name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node for eval grader regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Compile helpers
        run: python -m compileall -q skills/implementation/scripts tests
      - name: Validate public plugin source
        run: python skills/implementation/scripts/validate_repo.py .
      - name: Verify release bundle integrity
        run: python skills/implementation/scripts/release_integrity.py check . --manifest RELEASE-MANIFEST.json

  start-here:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install PyJWT for the webhook example
        run: python -m pip install "pyjwt[crypto]==2.10.1"
      - name: Run START_HERE.md code against a fake Lago API
        run: python -m unittest tests.test_start_here -v
      - name: Test the init package and template drift
        working-directory: packages/init
        run: npm test
