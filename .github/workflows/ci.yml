name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Compile helpers
        run: python -m compileall -q skills/implementation/scripts tests
      - name: Validate public plugin source
        run: python skills/implementation/scripts/validate_repo.py .
      - name: Verify release bundle integrity
        run: python skills/implementation/scripts/release_integrity.py check . --manifest RELEASE-MANIFEST.json
